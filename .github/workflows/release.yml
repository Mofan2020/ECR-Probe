name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: 发布前门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt

      - name: tag 必须和包里的版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import ecr_probe; print(ecr_probe.__version__)")
          echo "tag=$TAG code=$CODE"
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::tag ($TAG) 和 ecr_probe/__init__.py 的 __version__ ($CODE) 不一致"
            exit 1
          fi

      - name: Lint
        run: python -m ruff check ecr_probe tests scripts

      - name: Tests
        run: python -m pytest -q

      - name: 前端冒烟
        run: node scripts/check-app-js.js

  build:
    name: 打包 (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: ecr-probe-windows-x64.exe
            sep: ";"
            built: dist/ecr-probe.exe
            # Windows 的 pywebview 走后端 pythonnet/clr-loader，这两个是
            # 运行时动态加载的，PyInstaller 静态分析看不到，必须显式收集。
            extra: "--collect-all clr_loader --collect-all pythonnet"
          - os: macos-latest
            label: macos-arm64
            artifact: ecr-probe-macos-arm64
            sep: ":"
            built: dist/ecr-probe
            extra: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10"

      # 界面资源必须打进单文件，运行时由 resources.py 释放到持久目录并校验。
      # --add-data 的目标写 "gui"，跟 resources.bundled_dir() 找的
      # _MEIPASS/gui 对应。写错成 ecr_probe/gui 就会找不到。
      - name: PyInstaller 单文件
        shell: bash
        run: |
          # --add-data 的源用绝对路径：相对路径是相对 .spec 的位置解析的，
          # 一旦换了 --specpath 就会 "Unable to find .../gui"。踩过。
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --noupx \
            --name ecr-probe \
            --add-data "${GITHUB_WORKSPACE}/ecr_probe/gui${{ matrix.sep }}gui" \
            --collect-all webview \
            ${{ matrix.extra }} \
            --hidden-import psutil \
            launcher.py

      - name: 确认产物是单文件
        shell: bash
        run: |
          test -f "${{ matrix.built }}" || { echo "::error::没有产物 ${{ matrix.built }}"; exit 1; }
          ls -l "${{ matrix.built }}"
          # dist 里除了这一个不该有别的东西（build/、spec 在别处）
          COUNT=$(ls -1 dist | wc -l | tr -d ' ')
          echo "dist 条目数：$COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "::error::dist 里不止一个文件，不是单文件产物"
            ls -la dist
            exit 1
          fi

      # 真跑一遍，不是只看文件存不存在。
      - name: 冒烟跑产物
        shell: bash
        run: |
          export ECR_PROBE_HOME="$RUNNER_TEMP/ecr-home"

          echo "--- --version ---"
          "./${{ matrix.built }}" --version

          echo "--- resources（首次释放 + 校验）---"
          "./${{ matrix.built }}" resources

          echo "--- 确认资源真的落到持久目录 ---"
          test -f "$ECR_PROBE_HOME/resources/index.html"
          test -f "$ECR_PROBE_HOME/resources/app.js"
          test -f "$ECR_PROBE_HOME/resources/.resources.digest"
          python -c "import json,os;d=json.load(open(os.environ['ECR_PROBE_HOME']+'/resources/.resources.digest'));print('digest 覆盖文件数:',len(d['files']))"

          echo "--- 篡改后应能自己修回来 ---"
          echo "// tampered" >> "$ECR_PROBE_HOME/resources/app.js"
          "./${{ matrix.built }}" resources | tee out.txt
          grep -q "不通过" out.txt
          grep -q "复核：通过" out.txt

          echo "--- 命令目录条数 ---"
          "./${{ matrix.built }}" list | tail -2

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p release-asset
          cp "${{ matrix.built }}" "release-asset/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ecr-probe-${{ matrix.label }}
          path: release-asset/*
          if-no-files-found: error

  publish:
    name: 发 Pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 产物清单
        run: ls -lR assets

      - name: 建 Pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 不带 --prerelease 会落成 Draft；这里一律先发预发布，
          # 等实测确认后再手工升正式版。
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag \
            assets/*

      - name: 复核确实不是 Draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.tagName=="'"$GITHUB_REF_NAME"'")'
          DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" != "false" ]; then
            echo "::error::release 落成 Draft 了"
            exit 1
          fi
